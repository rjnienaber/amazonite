name: CI
on:
  push:
  pull_request:
    branches: [master]
  schedule:
    - cron: '37 0 * * *' # Nightly at 00:37
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        crystal: [latest, nightly]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: setup openssl (macos)
        if: matrix.os == 'macos-latest'
        run: |
          brew install pkg-config
      - name: download source
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: install crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}
      - name: cache shards
        uses: actions/cache@v6
        with:
          path: ~/.cache/shards
          key: ${{ runner.os }}-shards-${{ hashFiles('shard.yml') }}
          restore-keys: ${{ runner.os }}-shards-
      - name: install dependencies
        run: shards install
      - name: check formatting
        run: crystal tool format --check --exclude lib --exclude spec/fixtures
      - name: build ameba
        run: shards build ameba
      - name: check coding standards
        run: ./bin/ameba integration/ src/core/ codegen/ spec/
      - name: perform code generation
        run: shards run codegen
      - name: validate generated code
        run: |
          cp -R src/core tmp
          ./scripts/compile.sh
      - name: run unit tests
        run: crystal spec
  integration:
    strategy:
      fail-fast: false
      matrix:
        crystal: [latest, nightly]
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack
        ports:
          - 4566:4566
        env:
          PERSISTENCE: false
          SERVICES: s3,dynamodb,ssm,sqs,kms,secretsmanager,lambda,sns,iam,cloudwatch
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: download source
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: install crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}
      - name: cache shards
        uses: actions/cache@v6
        with:
          path: ~/.cache/shards
          key: ${{ runner.os }}-shards-${{ hashFiles('shard.yml') }}
          restore-keys: ${{ runner.os }}-shards-
      - name: install dependencies
        run: shards install
      - name: run integration tests
        run: ./scripts/run_integration.cr
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
