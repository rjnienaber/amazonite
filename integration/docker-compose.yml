version: "3.8"

services:
  localstack:
    container_name: localstack
    image: localstack/localstack
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
    environment:
      - PERSISTENCE=false
      - SERVICES=s3,dynamodb,ssm,sqs,kms,secretsmanager,lambda,sns,iam,cloudwatch
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock" # lambda invocation runs functions in per-invoke Docker containers
